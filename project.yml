name: LeonLoader
options:
  bundleIdPrefix: com.leon
  deploymentTarget:
    iOS: "16.0"

targets:
  LeonLoader:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - project.yml
          - README_RU.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leon.loader
        PRODUCT_NAME: LeonLoader
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LeonLoader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
